; ============================================================================
;  E7.1 STM32F103 + Q15 定点 FOC（阶段 7）
;  目标板：STM32F103C8T6 最小系统板（Blue Pill），插在 STM32_V3P 转接板上
;
;  编译：  pio run
;  烧录：  pio run -t upload          （需要 ST-Link，接 SWDIO/SWCLK/GND/3V3）
;
;  ⚠ 用之前请先确认两件事（见 docs/STM32转接板引脚映射对照表.md）：
;     ① MOTOR_EN 在转接板上的网名写成了 A8，与 PA8 可能没连通
;     ② M1 的三路 PWM 跨 TIM2/TIM3，所以本固件只做 M0
; ============================================================================

[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
lib_ldf_mode = deep+
build_unflags = -Os
build_flags =
	-O2
	-Wall
