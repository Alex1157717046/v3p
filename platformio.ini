; ============================================================================
;  DengFOC V3P 实操课程 —— PlatformIO 工程
;  每个实验一个 env，通过 build_src_filter 只编译对应的那一个源文件
;
;  用法示例：
;    pio run -e exp03_svpwm7                 # 编译
;    pio run -e exp03_svpwm7 -t upload       # 编译并烧录
;    pio device monitor -b 921600            # 看文本输出（不要和波形上位机同时开）
; ============================================================================

[platformio]
; 默认编译全部实验（增量编译很快；只想编一个就 pio run -e exp03_svpwm7）
default_envs =
	exp00_selftest
	exp01_sixstep
	exp02_spwm
	exp03_svpwm7
	exp04_svpwm5
	exp05_overmod
	exp06_deadtime
	exp07_gatedrive
	exp08_encoder
	exp09_current
	exp10_clarkepark
	exp11_adctiming
	exp12_current_loop
	exp13_current_dq
	exp14_speed_loop
	exp15_position_loop
	exp16_antiwindup
	exp17_filter
	exp21_flux_observer
	exp22_smo
	exp23_pll
	exp20_bemf_lambda
	exp24_if_start
	exp25_switch
	exp26_sensorless
	exp30_rs_id
	exp31_ls_id
	exp32_fault
	exp33_efficiency
	exp34_notch
	exp40_voltage_limit
	exp41_field_weakening

[env]
platform = espressif32@6.6.0
board = lolin32_lite
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_ldf_mode = deep+
; 控制环要求速度：用 -O2，关掉 -Os
build_unflags = -Os
build_flags =
	-O2
	-Wall

; ---------------------------------------------------------------------------
; 阶段 0 · 基线与测量链路
; ---------------------------------------------------------------------------
[env:exp00_selftest]
build_src_filter = +<exp00_selftest.cpp>

; ---------------------------------------------------------------------------
; 阶段 1 · 功率级与调制（全开环）
; ---------------------------------------------------------------------------
[env:exp01_sixstep]
build_src_filter = +<exp01_sixstep.cpp>

[env:exp02_spwm]
build_src_filter = +<exp02_spwm.cpp>

[env:exp03_svpwm7]
build_src_filter = +<exp03_svpwm7.cpp>

[env:exp04_svpwm5]
build_src_filter = +<exp04_svpwm5.cpp>

[env:exp05_overmod]
build_src_filter = +<exp05_overmod.cpp>

[env:exp06_deadtime]
build_src_filter = +<exp06_deadtime.cpp>

[env:exp07_gatedrive]
build_src_filter = +<exp07_gatedrive.cpp>

; ---------------------------------------------------------------------------
; 阶段 2 · 采样与坐标变换
; ---------------------------------------------------------------------------
[env:exp08_encoder]
build_src_filter = +<exp08_encoder.cpp>

[env:exp09_current]
build_src_filter = +<exp09_current.cpp>

[env:exp10_clarkepark]
